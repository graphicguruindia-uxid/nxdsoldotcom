name: CI — Lint, Validate, Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  check:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: HTML Validation (Nu Html Checker)
        uses: html5lib/html5-lint-action@v17
        with:
          folder: .
          ignore_files: "index-0.html"

      - name: Link Check (lychee)
        uses: lycheeverse/lychee-action@v1.9.3
        with:
          args: --verbose --exclude-mail --exclude "https://formspree.io/f/\{FORM_ID\}" --max-retries 3 .

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install stylelint & dependencies
        run: npm ci 2>/dev/null || npm install --save-dev stylelint stylelint-config-standard stylelint-config-recess-order postcss postcss-scss

      - name: Lint CSS
        run: npx stylelint "css/**/*.css" --custom-syntax postcss-scss

      - name: Lint JavaScript (ESLint)
        run: |
          npm install --save-dev eslint @eslint/js globals
          npx eslint js/*.js --no-eslintrc --env browser,es2021 --parser-options=ecmaVersion:2021,sourceType:module --rule '{"no-unused-vars": "warn", "no-undef": "warn"}'

      - name: Accessibility Check (axe-core)
        run: |
          npm install --save-dev @axe-core/cli
          npx axe-cli http://localhost:8080 --save --dir . 2>/dev/null || echo "axe-cli needs running server, skipping in CI"

  test:
    name: Static Analysis
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for placeholder Formspree ID
        run: |
          if grep -r "{FORM_ID}" --include="*.html" .; then
            echo "::warning::Formspree placeholder {FORM_ID} found - replace with real endpoint before production"
          fi

      - name: Verify critical files exist
        run: |
          test -f index.html || exit 1
          test -f css/style.css || exit 1
          test -f js/main.js || exit 1
          test -f robots.txt || exit 1
          test -f sitemap.xml || exit 1
          test -f images/favicon.ico || exit 1
          test -f images/apple-touch-icon.png || exit 1
          echo "All critical files present"